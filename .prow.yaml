presubmits:

- name: pull-test-infra-prow-checkconfig
  decorate: true
  run_if_changed: '^(\.prow|prow/gcp/(config|plugins|cluster/jobs/.*))\.yaml$'
  spec:
    nodeSelector:
      kubernetes.io/arch: amd64
    containers:
    - image: us-docker.pkg.dev/k8s-infra-prow/images/checkconfig:v20260821-a61940897
      command:
      - checkconfig
      args:
      - --config-path=prow/gcp/config.yaml
      - --job-config-path=prow/gcp/cluster/jobs
      - --plugin-config=prow/gcp/plugins.yaml
      - --prow-yaml-repo-name=$(REPO_OWNER)/$(REPO_NAME)
      - --strict
      - --exclude-warning=mismatched-tide
      - --exclude-warning=non-decorated-jobs
      - --exclude-warning=long-job-names
