# Restart deck-private every 12 hours to pick up new Cloudflare credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deck-private-rollout
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deck-private-rollout
  namespace: default
rules:
- apiGroups:
  - apps
  resourceNames:
  - deck-private
  resources:
  - deployments
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deck-private-rollout
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deck-private-rollout
subjects:
- kind: ServiceAccount
  name: deck-private-rollout
  namespace: default
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deck-private-rollout
  namespace: default
spec:
  schedule: "30 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: deck-private-rollout
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
          - name: rollout
            image: gcr.io/istio-testing/build-tools:master-344978549023107b14c57d2ef8523d41b82ccc76
            imagePullPolicy: IfNotPresent
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              kubectl rollout restart deployment/deck-private --namespace=default
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 64Mi
