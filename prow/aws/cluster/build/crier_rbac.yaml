apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crier
  namespace: test-pods
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - events
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crier-namespaced
  namespace: test-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crier
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: prow:crier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crier
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crier
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: prow:crier
