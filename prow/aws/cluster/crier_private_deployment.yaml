# A second crier that only runs the blob-storage reporters for the private
# bucket (istio-prow-private). R2 temporary credentials are scoped to a single
# bucket and crier accepts a single --s3-credentials-file, so the main crier
# cannot write to both buckets. GitHub and Slack reporting stay in the main
# crier to avoid duplicate statuses and messages.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crier-private
  namespace: default
  labels:
    app: crier-private
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crier-private
  template:
    metadata:
      labels:
        app: crier-private
    spec:
      serviceAccountName: crier
      terminationGracePeriodSeconds: 30
      containers:
      - name: crier
        image: us-docker.pkg.dev/k8s-infra-prow/images/crier:v20260526-71428b9c2
        args:
        - --blob-storage-workers=1
        - --config-path=/etc/config/config.yaml
        - --job-config-path=/etc/job-config
        - --kubernetes-blob-storage-workers=1
        - --s3-credentials-file=/etc/cf-r2-istio-prow-private-credentials/service-account.json
        env:
        # Use KUBECONFIG envvar rather than --kubeconfig flag in order to provide multiple configs to merge.
        - name: KUBECONFIG
          value: "/etc/kubeconfig/kubeconfig"
        - name: AWS_REGION
          value: "us-west-2"
        ports:
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - mountPath: /etc/kubeconfig
          name: kubeconfig
          readOnly: true
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: job-config
          mountPath: /etc/job-config
          readOnly: true
        - name: cf-r2-istio-prow-private-credentials
          mountPath: /etc/cf-r2-istio-prow-private-credentials
          readOnly: true
      volumes:
      - name: kubeconfig
        configMap:
          defaultMode: 420
          name: kubeconfig
      - name: config
        configMap:
          name: config
      - name: job-config
        configMap:
          name: job-config
      - name: cf-r2-istio-prow-private-credentials
        secret:
          secretName: cf-r2-istio-prow-private-credentials
