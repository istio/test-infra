presubmits:
  istio/test-infra:
  - name: pull-test-infra-check-testgrid-config
    run_if_changed: '^(prow/gcp/cluster/jobs/.*\.yaml)|(testgrid/default\.yaml)$'
    decorate: true
    branches:
    - master
    annotations:
      testgrid-create-test-group: "false"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
        testing: test-pool
      containers:
      - image: gcr.io/k8s-prow/configurator:v20240405-c76de01869
        command:
        - configurator
        args:
        - --yaml=testgrid/config.yaml
        - --default=testgrid/default.yaml
        - --prow-config=prow/gcp/config.yaml
        - --prow-job-config=prow/gcp/cluster/jobs
        - --prowjob-url-prefix=https://github.com/istio/test-infra/tree/master/prow/gcp/cluster/jobs
        - --update-description
        - --validate-config-file
        - --oneshot
        resources:
          requests:
            memory: "1Gi"
            cpu: 1

periodics:
- cron: "05 15-23 * * 1-5"  # Run at 7:05-15:05 PST (15:05 UTC) Mon-Fri
  name: ci-prow-autobump-aws
  cluster: test-infra-trusted
  decorate: true
  extra_refs:
  - org: istio
    repo: test-infra
    base_ref: master
  annotations:
    testgrid-create-test-group: "false"
  spec:
    automountServiceAccountToken: false
    containers:
    - image: us-docker.pkg.dev/k8s-infra-prow/images/generic-autobumper:v20260714-0633879af
      command:
      - generic-autobumper
      args:
      - --config=prow/aws/istio-autobump-config.yaml
      volumeMounts:
      - name: github
        mountPath: /etc/github-token
        readOnly: true
      - name: ssh
        mountPath: /root/.ssh
    volumes:
    - name: github
      secret:
        secretName: github-istio-testing-pusher
    - name: ssh
      secret:
        secretName: istio-testing-robot-ssh-key
        defaultMode: 0400

postsubmits:
  istio/test-infra:
  - name: deploy-prow_test-infra_postsubmit
    annotations:
      testgrid-alert-email: istio-oncall@googlegroups.com
      testgrid-dashboards: istio_test-infra_postsubmit
      testgrid-num-failures-to-alert: "1"
    branches:
    - ^master$
    cluster: test-infra-trusted
    decorate: true
    max_concurrency: 1
    path_alias: istio.io/test-infra
    reporter_config:
      slack:
        channel: oncall
        job_states_to_report:
        - success
        - failure
        - aborted
        - error
        report_template: 'Deploying prow: {{.Status.State}}. <{{.Spec.Refs.BaseLink}}|Commit
          {{.Spec.Refs.BaseSHA}}> <{{.Status.URL}}|View logs> <https://testgrid.k8s.io/istio_test-infra_postsubmit#deploy-prow_test-infra_postsubmit|Job
          history on Testgrid>'
    run_if_changed: ^prow/aws/cluster/(?:gcsweb/|build/|private/|[^/]+\.yaml$)
    spec:
      serviceAccountName: prow-deployer
      automountServiceAccountToken: false
      containers:
      - command:
        - make
        - -C
        - prow/aws
        - deploy
        - deploy-gcsweb
        - deploy-build
        - deploy-private
        image: gcr.io/istio-testing/build-tools:master-344978549023107b14c57d2ef8523d41b82ccc76
        resources:
          limits:
            cpu: "3"
            memory: 24Gi
          requests:
            cpu: "1"
            memory: 3Gi
        securityContext:
          privileged: true
