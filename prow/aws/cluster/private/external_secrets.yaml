---
# NOTE: When adding a new ExternalSecret here, make sure the private cluster's
# ESO controller role (eso_read_secrets["prow-private"] in
# infra/aws/istio/external_secrets.tf) is granted read on the new secret.
# Without that IAM grant the operator cannot fetch the secret and the K8s Secret
# will not be created.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-r2-istio-prow-private-credentials
  namespace: test-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: cf-r2-istio-prow-private-credentials
  data:
  - secretKey: service-account.json
    remoteRef:
      key: cf_r2_istio-prow-private_credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-oauth
  namespace: test-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: github-oauth
  data:
  # Used by clonerefs via oauth_token_secret for repo istio-private (prow/aws/config.yaml).
  - secretKey: token
    remoteRef:
      key: github_istio-private_clone
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netrc-secret
  namespace: test-pods
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: netrc-secret
    template:
      data:
        # Mounted by the preset-enable-netrc preset (prow/aws/config/private-presets.yaml).
        secret: |
          machine github.com
            login x-access-token
            password {{ .token }}
          machine api.github.com
            login x-access-token
            password {{ .token }}
  data:
  - secretKey: token
    remoteRef:
      key: github_istio-private_clone
