defaults:
  branches:
  - release-1.32
  repo-allowlist:
  - istio
org: istio
repo: istio
transforms:
- env:
    DOCKER_HUB: ghcr.io/istio/prow-private
    DOCKER_PUSH_HUB: ghcr.io/istio/prow-private
    HELM_HUB: ghcr.io/istio/prow-private/charts
    R2_BUCKET: istio-build-private/dev
  job-allowlist:
  - release_istio_release-1.32_postsubmit
  job-type:
  - postsubmit
  labels:
    preset-enable-netrc: "true"
    preset-override-deps: release-1.32-istio
    preset-override-envoy-r2: "true"
  requirements:
  - cf-r2-istio-build-private-auth
  - prerelease-ghcr
  selector:
    testing: test-pool
- job-allowlist:
  - lint_istio_release-1.32
  - gencheck_istio_release-1.32
  - govulncheck_istio_release-1.32
  - bookinfo-build_istio_release-1.32
  - macbuildcheck_istio_release-1.32
  - windowsbuildcheck_istio_release-1.32
  job-type:
  - presubmit
  - postsubmit
  labels:
    preset-enable-netrc: "true"
    preset-override-deps: release-1.32-istio
- job-denylist:
  - benchmark-report_istio_release-1.32_postsubmit
  - release_istio_release-1.32_postsubmit
  - release-notes_istio_release-1.32
  - build-base-images_istio_release-1.32
  - lint_istio_release-1.32
  - gencheck_istio_release-1.32
  - govulncheck_istio_release-1.32
  - bookinfo-build_istio_release-1.32
  - macbuildcheck_istio_release-1.32
  - windowsbuildcheck_istio_release-1.32
  job-type:
  - presubmit
  - postsubmit
  labels:
    preset-enable-netrc: "true"
    preset-override-deps: release-1.32-istio
    preset-override-envoy-r2: "true"
  requirements:
  - cf-r2-istio-build-private-auth
