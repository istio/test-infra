autogen_header: "# THIS FILE IS AUTOGENERATED. See prow/config/README.md"

path_aliases:
  istio: istio.io

node_selector:
  testing: test-pool

auto_max_procs: true

env:
- name: BUILD_WITH_CONTAINER
  value: "0"
- name: GOPROXY
  value: http://athens.athens.svc.cluster.local:3000|direct

testgrid_config:
  enabled: true
  alert_email: istio-oncall@googlegroups.com
  num_failures_to_alert: "1"

resources_presets:
  default:
    limits:
      cpu: 3000m
      memory: 24Gi
    requests:
      cpu: 1000m
      memory: 3Gi

requirements: [cache]
requirement_presets:
  trusted:
    podSpec:
      nodeSelector:
        testing: trusted
      tolerations:
      - key: testing
        operator: Equal
        value: trusted
        effect: NoSchedule
  bazel-cache-presubmit:
    env:
    - name: BAZEL_BUILD_RBE_CACHE
      value: http://localhost:8080
    sidecars:
    - name: bazel-remote
      image: 678412441677.dkr.ecr.us-west-2.amazonaws.com/docker/buchgr/bazel-remote-cache:v2.6.2
      args:
      - --dir=/data
      - --http_address=0.0.0.0:8080
      - --grpc_address=0.0.0.0:9092
      - --max_size=16
      - --s3.auth_method=iam_role
      - --s3.bucket=$(BAZEL_REMOTE_BUCKET)
      - --s3.endpoint=s3.us-west-2.amazonaws.com
      - --s3.prefix=proxy
      - --s3.region=us-west-2
      env:
      - name: BAZEL_REMOTE_BUCKET
        value: istio-prow-bazel-cache
      ports:
      - name: bazel-cache
        containerPort: 8080
        protocol: TCP
      readinessProbe:
        grpc:
          port: 9092
        periodSeconds: 3
        timeoutSeconds: 10
      livenessProbe:
        grpc:
          port: 9092
        initialDelaySeconds: 3
        periodSeconds: 10
        timeoutSeconds: 3
      resources:
        limits:
          cpu: "2"
          ephemeral-storage: 32Gi
          memory: 4Gi
        requests:
          cpu: 500m
          ephemeral-storage: 1Gi
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      volumeMounts:
      - mountPath: /data
        name: bazel-cache
    volumes:
    - emptyDir:
        sizeLimit: 32Gi
      name: bazel-cache
  bazel-cache-postsubmit:
    env:
    - name: BAZEL_BUILD_RBE_CACHE
      value: http://localhost:8080
    sidecars:
    - name: bazel-remote
      image: 678412441677.dkr.ecr.us-west-2.amazonaws.com/docker/buchgr/bazel-remote-cache:v2.6.2
      args:
      - --dir=/data
      - --http_address=0.0.0.0:8080
      - --grpc_address=0.0.0.0:9092
      - --max_size=16
      - --s3.auth_method=iam_role
      - --s3.bucket=$(BAZEL_REMOTE_BUCKET)
      - --s3.endpoint=s3.us-west-2.amazonaws.com
      - --s3.prefix=proxy
      - --s3.region=us-west-2
      env:
      - name: BAZEL_REMOTE_BUCKET
        value: istio-prow-bazel-cache-postsubmit
      ports:
      - name: bazel-cache
        containerPort: 8080
        protocol: TCP
      readinessProbe:
        grpc:
          port: 9092
        periodSeconds: 3
        timeoutSeconds: 10
      livenessProbe:
        grpc:
          port: 9092
        initialDelaySeconds: 3
        periodSeconds: 10
        timeoutSeconds: 3
      resources:
        limits:
          cpu: "2"
          ephemeral-storage: 64Gi
          memory: 4Gi
        requests:
          cpu: 500m
          ephemeral-storage: 1Gi
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      volumeMounts:
      - mountPath: /data
        name: bazel-cache
    volumes:
    - emptyDir:
        sizeLimit: 150Gi
      name: bazel-cache
  ecr:
    env:
    - name: ECR_REGISTRY
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com
    - name: ISTIO_BASE_REGISTRY
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com/docker/istio
    - name: ISTIO_BUILDKIT_IMAGE
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com/ghcr/istio/testing/buildkit:v0.11.0
    - name: WASM_REGISTRY
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com/ghcr/istio/testing
    - name: METALLB_REGISTRY
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com/ghcr/istio/testing
  kind:
    volumeMounts:
    - mountPath: /lib/modules
      name: modules
      readOnly: true
    - mountPath: /var/lib/docker
      name: docker-root
    volumes:
    - hostPath:
        path: /lib/modules
        type: Directory
      name: modules
    - emptyDir: {}
      name: docker-root
  docker:
    volumeMounts:
    - mountPath: /var/lib/docker
      name: docker-root
    volumes:
    - emptyDir: {}
      name: docker-root
  cache:
    volumeMounts:
    - mountPath: /home/prow/go/pkg
      name: build-cache
      subPath: gomod
    volumes:
    - hostPath:
        path: /var/tmp/prow/cache
        type: DirectoryOrCreate
      name: build-cache
  gocache:
    volumeMounts:
    - mountPath: /gocache
      name: build-cache
      subPath: gocache
    volumes:
    - hostPath:
        path: /var/tmp/prow/cache
        type: DirectoryOrCreate
      name: build-cache
  cratescache:
    # Rust quite expensive to compile and benefits from faster CPUs.
    # Additionally, its jobs are not super common, minimizing cache sharing when spread across all nodes.
    # Prefer the "C3" nodes, which are faster. Since that cuts down the number of nodes we prefer, it results in better caching too.
    podSpec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: cloud.google.com/machine-family
                  operator: In
                  values: [c3, c3d, n4, c4d, c4a, c4]
    volumeMounts:
    - mountPath: /home/.cargo
      name: build-cache
      subPath: cargo
    volumes:
    - hostPath:
        path: /var/tmp/prow/cache
        type: DirectoryOrCreate
      name: build-cache
  rustccache:
    env:
    - name: RUST_CACHE_DIR
      value: /var/run/rustc-cache
    volumeMounts:
    - mountPath: /var/run/rustc-cache
      name: build-cache # Depends on 'cratescache' to define the volume
      subPath: rustc

  # Access to istio-testing GitHub, with `admin:org`.
  # Highly privileged, should only be used from istio/community.
  # TODO: move to GCP Secrets
  github-organization:
    volumeMounts:
    - mountPath: /etc/github-token
      name: github
      readOnly: true
    volumes:
    - name: github
      secret:
        secretName: oauth-token
  # Access to anonymous readonly GitHub.
  github-readonly:
    podSpec:
      serviceAccountName: prowjob-github-read
    secrets:
      - secret: github-read_github_read
        project: istio-prow-build
        env: GH_TOKEN
  # Access to push GitHub from 'istio-testing' account.
  github-istio-testing:
    podSpec:
      serviceAccountName: prowjob-github-istio-testing
    secrets:
      - secret: github_istio-testing_pusher
        project: istio-prow-build
        env: GH_TOKEN
  cf-r2-istio-build-auth:
    secrets:
      - secret: cf_r2_istio-build_credentials
        project: istio-testing
        env: CF_CREDENTIALS
  cf-r2-istio-prow-auth:
    secrets:
      - secret: cf_r2_istio-prow_credentials
        project: istio-testing
        env: CF_CREDENTIALS
  cf-r2-istio-prerelease-auth:
    secrets:
      - secret: cf_r2_istio-prerelease_credentials
        project: istio-testing
        # We have a job that pulls from prerelease buckets and publishes to release buckets.
        # Since this needs to pull from the prerelease bucket and push to the release bucket,
        # the env var name needs to be different.
        env: CF_PRERELEASE_CREDENTIALS
  cf-r2-istio-release-auth:
    secrets:
      - secret: cf_r2_istio-release_credentials
        project: istio-testing
        env: CF_CREDENTIALS
  cf-r2-istio-prerelease-private-auth:
    secrets:
      - secret: cf_r2_istio-prerelease-private_credentials
        project: istio-testing
        # We have a job that pulls from prerelease buckets and publishes to release buckets.
        # Since this needs to pull from the prerelease bucket and push to the release bucket,
        # the env var name needs to be different.
        env: CF_PRERELEASE_CREDENTIALS
  cf-r2-istio-build-private-auth:
    secrets:
      - secret: cf_r2_istio-build-private_credentials
        project: istio-testing
        env: CF_CREDENTIALS
  # Generic read-only credentials for the public R2 buckets. Safe to grant to
  # untrusted presubmits since it cannot write anywhere.
  cf-r2-public-ro-auth:
    secrets:
      - secret: cf_r2_public_buckets_ro_credentials
        project: istio-testing
        env: CF_CREDENTIALS
  # build-base has access to push to dockerhub and to push as istio-testing github. Only for use with base image building
  testing-pusher:
    env:
    - name: DOCKER_CONFIG
      value: /var/run/ci/docker
    secrets:
      - secret: testing_ghcr_istio
        file: /var/run/ci/docker/config.json
  build-base:
    env:
    - name: DOCKER_CONFIG
      value: /var/run/ci/docker
    podSpec:
      serviceAccountName: prowjob-release
    secrets:
      - secret: release_docker_istio
        project: istio-prow-build
        file: /var/run/ci/docker/config.json
      - secret: github_istio-testing_pusher # Note: This is NOT "release_github_istio-release", which is why this is separate from 'releae'
        project: istio-prow-build
        env: GH_TOKEN
  prerelease-ghcr:
    env:
    - name: DOCKER_CONFIG
      value: /var/run/ci/docker
    secrets:
    - secret: prerelease_ghcr_istio
      project: istio-prow-build
      file: /var/run/ci/docker/config.json
  # release is used for release jobs. This is the most privileged type of job.
  release:
    # For publish, we also need Grafana token, DockerHub token, and GitHub login
    podSpec:
      serviceAccountName: prowjob-release
    env:
      - name: COSIGN_KEY
        value: "awskms:///alias/istio-cosign"
      - name: AWS_REGION
        value: us-west-2
      - name: DOCKER_CONFIG
        value: /var/run/ci/docker
      - name: GRAFANA_TOKEN_FILE
        value: /var/run/ci/grafana/token
      - name: GITHUB_TOKEN_FILE
        value: /var/run/ci/github/token
    secrets:
      - secret: release_docker_istio
        project: istio-prow-build
        file: /var/run/ci/docker/config.json
      - secret: release_github_istio-release
        project: istio-prow-build
        file: /var/run/ci/github/token
      - secret: release_grafana_istio
        project: istio-prow-build
        file: /var/run/ci/grafana/token
  # If enabled, jobs will report traces to GCP Cloud Trace
  tracing:
    env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: grpc
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://collector.opentelemetry:4317
    - name: OTEL_EXPORTER_OTLP_INSECURE
      value: "true"
