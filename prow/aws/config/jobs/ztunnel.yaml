org: istio
repo: ztunnel
image: 678412441677.dkr.ecr.us-west-2.amazonaws.com/ghcr/istio/testing/build-tools:master-80657d56e324b5d8b4a74806bf0979e4b89e99a5
support_release_branching: true

jobs:
  - name: test
    command: [entrypoint, ./scripts/run-cached.sh, make, presubmit]
    requirements: [cratescache, rustccache]

  - name: bench
    command: [entrypoint, ./scripts/benchtest.sh]
    modifiers: [presubmit_optional, presubmit_skipped]
    types: [presubmit]
    requirements: [cratescache]

  - name: coverage
    command: [entrypoint, make, coverage]
    types: [postsubmit]
    requirements: [cratescache]

  - name: release
    architectures: [amd64, arm64]
    service_account_name: prowjob-testing-write
    types: [postsubmit]
    command: [entrypoint, make, release]
    requirements: [cratescache, cf-r2-istio-build-auth, trusted]

resources_presets:
  # Rust jobs are CPU intensive. Bump up defaults (from 1/3) to 3/8 to speed up jobs.
  default:
    requests:
      memory: "3Gi"
      cpu: "5000m"
    limits:
      memory: "24Gi"
      cpu: "8000m"
