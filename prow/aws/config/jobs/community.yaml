org: istio
repo: community
image: 678412441677.dkr.ecr.us-west-2.amazonaws.com/ghcr/istio/testing/build-tools:master-0eb075252e41929398de2248541496a173b79087

jobs:
  - name: lint
    command: [prow/community-lint.sh]

  - name: test
    command: [make, test]

  - name: sync-org
    types: [postsubmit]
    command: [org-gen, --write-to-github, --github-token=/etc/github-token/oauth]
    node_selector:
      prod: prow
    requirements: [github-organization]
    excluded_requirements: [cache]
    timeout: 4h
    cluster: test-infra-trusted

  - name: sync-dot-project
    types: [postsubmit]
    command:
    - entrypoint
    - ../test-infra/tools/automator/automator.sh
    - --org=$AUTOMATOR_ORG
    - --repo=.project
    - "--title=Automator: sync maintainers.yaml from istio/community@$AUTOMATOR_SRC_BRANCH"
    - --labels=auto-merge,release-notes-none
    - --strict
    - --modifier=sync-maintainers
    - --token-env
    - --script-path=prow/sync-dot-project.sh
    requirements: [github-istio-testing, trusted]
    repos: [istio/test-infra@master]
    env:
    - name: AUTOMATOR_ORG
      value: istio
