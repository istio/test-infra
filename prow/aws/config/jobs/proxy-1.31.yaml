    cf-r2-public-ro-auth:
      secrets:
      - env: CF_CREDENTIALS
        project: istio-testing
        secret: cf_r2_public_buckets_ro_credentials
    cratescache:
      podSpec:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                - key: cloud.google.com/machine-family
