  name: test
  node_selector:
    testing: build-pool
  requirement_presets:
    bazel-cache-postsubmit:
      env:
      - name: BAZEL_BUILD_RBE_CACHE
        value: http://localhost:8080
      sidecars:
      - args:
        - --dir=/data
        - --http_address=0.0.0.0:8080
        - --grpc_address=0.0.0.0:9092
        - --max_size=16
        - --s3.auth_method=iam_role
        - --s3.bucket=$(BAZEL_REMOTE_BUCKET)
        - --s3.endpoint=s3.us-west-2.amazonaws.com
        - --s3.prefix=proxy
        - --s3.region=us-west-2
        env:
        - name: BAZEL_REMOTE_BUCKET
          value: istio-prow-bazel-cache-postsubmit
        image: 678412441677.dkr.ecr.us-west-2.amazonaws.com/docker/buchgr/bazel-remote-cache:v2.6.2
        name: bazel-remote
        ports:
        - containerPort: 8080
          name: bazel-cache
          protocol: TCP
        readinessProbe:
          grpc:
            port: 9092
          periodSeconds: 3
          timeoutSeconds: 10
        livenessProbe:
          grpc:
            port: 9092
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "2"
            ephemeral-storage: 32Gi
            memory: 4Gi
          requests:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /data
          name: bazel-cache
      volumes:
      - emptyDir:
          sizeLimit: 32Gi
        name: bazel-cache
    bazel-cache-presubmit:
      env:
      - name: BAZEL_BUILD_RBE_CACHE
        value: http://localhost:8080
      sidecars:
      - args:
        - --dir=/data
        - --http_address=0.0.0.0:8080
