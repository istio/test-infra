        env:
        - name: BAZEL_REMOTE_BUCKET
          value: istio-prow-bazel-cache
        image: 678412441677.dkr.ecr.us-west-2.amazonaws.com/docker/buchgr/bazel-remote-cache:v2.6.2
        name: bazel-remote
        ports:
        - containerPort: 8080
          name: bazel-cache
          protocol: TCP
        readinessProbe:
          grpc:
            port: 9092
          periodSeconds: 3
          timeoutSeconds: 10
        livenessProbe:
          grpc:
            port: 9092
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "2"
            ephemeral-storage: 32Gi
            memory: 4Gi
          requests:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /data
          name: bazel-cache
      volumes:
      - emptyDir:
          sizeLimit: 32Gi
        name: bazel-cache
    build-base:
      env:
      - name: DOCKER_CONFIG
        value: /var/run/ci/docker
      podSpec:
        containers: null
        serviceAccountName: prowjob-release
      secrets:
      - file: /var/run/ci/docker/config.json
        project: istio-prow-build
        secret: release_docker_istio
      - env: GH_TOKEN
        project: istio-prow-build
        secret: github_istio-testing_pusher
    cache:
      volumeMounts:
      - mountPath: /home/prow/go/pkg
        name: build-cache
        subPath: gomod
      volumes:
      - hostPath:
          path: /var/tmp/prow/cache
          type: DirectoryOrCreate
        name: build-cache
    cf-r2-istio-build-auth:
      secrets:
      - env: CF_CREDENTIALS
        project: istio-testing
        secret: cf_r2_istio-build_credentials
    cf-r2-istio-build-private-auth:
      secrets:
