  testing: test-pool
org: istio
repo: common-files
requirement_presets:
  bazel-cache-postsubmit:
    env:
    - name: BAZEL_BUILD_RBE_CACHE
      value: http://localhost:8080
    sidecars:
    - args:
      - --dir=/data
      - --http_address=0.0.0.0:8080
      - --grpc_address=0.0.0.0:9092
      - --max_size=16
      - --s3.auth_method=iam_role
      - --s3.bucket=$(BAZEL_REMOTE_BUCKET)
      - --s3.endpoint=s3.us-west-2.amazonaws.com
      - --s3.prefix=proxy
      - --s3.region=us-west-2
      env:
      - name: BAZEL_REMOTE_BUCKET
        value: istio-prow-bazel-cache-postsubmit
      image: 678412441677.dkr.ecr.us-west-2.amazonaws.com/docker/buchgr/bazel-remote-cache:v2.6.2
      livenessProbe:
        grpc:
          port: 9092
          service: null
        initialDelaySeconds: 3
        periodSeconds: 10
        timeoutSeconds: 3
      name: bazel-remote
      ports:
      - containerPort: 8080
        name: bazel-cache
        protocol: TCP
      readinessProbe:
        grpc:
          port: 9092
          service: null
        periodSeconds: 3
        timeoutSeconds: 10
      resources:
        limits:
          cpu: "2"
          ephemeral-storage: 64Gi
          memory: 4Gi
        requests:
          cpu: 500m
          ephemeral-storage: 32Gi
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      volumeMounts:
      - mountPath: /data
        name: bazel-cache
    volumes:
    - emptyDir:
        sizeLimit: 150Gi
      name: bazel-cache
  bazel-cache-presubmit:
    env:
    - name: BAZEL_BUILD_RBE_CACHE
      value: http://localhost:8080
    sidecars:
    - args:
      - --dir=/data
      - --http_address=0.0.0.0:8080
      - --grpc_address=0.0.0.0:9092
      - --max_size=16
      - --s3.auth_method=iam_role
      - --s3.bucket=$(BAZEL_REMOTE_BUCKET)
      - --s3.endpoint=s3.us-west-2.amazonaws.com
      - --s3.prefix=proxy
      - --s3.region=us-west-2
      env:
      - name: BAZEL_REMOTE_BUCKET
        value: istio-prow-bazel-cache
      image: 678412441677.dkr.ecr.us-west-2.amazonaws.com/docker/buchgr/bazel-remote-cache:v2.6.2
      livenessProbe:
        grpc:
          port: 9092
          service: null
        initialDelaySeconds: 3
        periodSeconds: 10
        timeoutSeconds: 3
      name: bazel-remote
      ports:
      - containerPort: 8080
        name: bazel-cache
        protocol: TCP
      readinessProbe:
        grpc:
          port: 9092
          service: null
        periodSeconds: 3
        timeoutSeconds: 10
      resources:
        limits:
          cpu: "2"
          ephemeral-storage: 32Gi
          memory: 4Gi
        requests:
          cpu: 500m
          ephemeral-storage: 32Gi
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      volumeMounts:
      - mountPath: /data
        name: bazel-cache
    volumes:
    - emptyDir:
        sizeLimit: 32Gi
      name: bazel-cache
  binfmt:
    labels:
      prow.istio.io/binfmt-mutator: "true"
    podSpec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                prow.istio.io/binfmt-mutator: "true"
            topologyKey: kubernetes.io/hostname
      containers: null
  build-base:
    env:
    - name: DOCKER_CONFIG
      value: /var/run/ci/docker
    podSpec:
      containers: null
      serviceAccountName: prowjob-release
    secrets:
    - file: /var/run/ci/docker/config.json
      project: istio-prow-build
      secret: release_docker_istio
    - env: GH_TOKEN
      project: istio-prow-build
      secret: github_istio-testing_pusher
  cache:
    volumeMounts:
    - mountPath: /home/prow/go/pkg
      name: build-cache
      subPath: gomod
    volumes:
    - hostPath:
        path: /var/tmp/prow/cache
        type: DirectoryOrCreate
      name: build-cache
  cf-r2-istio-build-auth:
    secrets:
    - env: CF_CREDENTIALS
      project: istio-testing
      secret: cf_r2_istio-build_credentials
  cf-r2-istio-build-private-auth:
    secrets:
    - env: CF_CREDENTIALS
      project: istio-testing
      secret: cf_r2_istio-build-private_credentials
  cf-r2-istio-prerelease-auth:
    secrets:
    - env: CF_PRERELEASE_CREDENTIALS
      project: istio-testing
      secret: cf_r2_istio-prerelease_credentials
  cf-r2-istio-prerelease-private-auth:
    secrets:
    - env: CF_PRERELEASE_CREDENTIALS
      project: istio-testing
      secret: cf_r2_istio-prerelease-private_credentials
  cf-r2-istio-prow-auth:
    secrets:
    - env: CF_CREDENTIALS
      project: istio-testing
      secret: cf_r2_istio-prow_credentials
  cf-r2-istio-release-auth:
    secrets:
    - env: CF_CREDENTIALS
      project: istio-testing
      secret: cf_r2_istio-release_credentials
  cf-r2-public-ro-auth:
    secrets:
    - env: CF_CREDENTIALS
      project: istio-testing
      secret: cf_r2_public_buckets_ro_credentials
  cratescache:
    podSpec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: cloud.google.com/machine-family
                operator: In
                values:
                - c3
                - c3d
                - n4
                - c4d
                - c4a
                - c4
            weight: 1
      containers: null
    volumeMounts:
    - mountPath: /home/.cargo
      name: build-cache
      subPath: cargo
    volumes:
    - hostPath:
        path: /var/tmp/prow/cache
        type: DirectoryOrCreate
      name: build-cache
  docker:
    volumeMounts:
    - mountPath: /var/lib/docker
      name: docker-root
    volumes:
    - emptyDir: {}
      name: docker-root
  ecr:
    env:
    - name: ECR_REGISTRY
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com
    - name: ISTIO_BASE_REGISTRY
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com/docker/istio
    - name: ISTIO_BUILDKIT_IMAGE
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com/ghcr/istio/testing/buildkit:v0.11.0
    - name: WASM_REGISTRY
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com/ghcr/istio/testing
    - name: METALLB_REGISTRY
      value: 678412441677.dkr.ecr.us-west-2.amazonaws.com/ghcr/istio/testing
  github-istio-testing:
    podSpec:
      containers: null
      serviceAccountName: prowjob-github-istio-testing
    secrets:
    - env: GH_TOKEN
      project: istio-prow-build
      secret: github_istio-testing_pusher
  github-organization:
    volumeMounts:
    - mountPath: /etc/github-token
      name: github
      readOnly: true
    volumes:
    - name: github
      secret:
        secretName: oauth-token
  github-readonly:
    podSpec:
      containers: null
      serviceAccountName: prowjob-github-read
    secrets:
    - env: GH_TOKEN
      project: istio-prow-build
      secret: github-read_github_read
  gocache:
    volumeMounts:
    - mountPath: /gocache
      name: build-cache
      subPath: gocache
    volumes:
    - hostPath:
        path: /var/tmp/prow/cache
        type: DirectoryOrCreate
      name: build-cache
  kind:
    volumeMounts:
    - mountPath: /lib/modules
      name: modules
      readOnly: true
    - mountPath: /var/lib/docker
      name: docker-root
    volumes:
    - hostPath:
        path: /lib/modules
        type: Directory
      name: modules
    - emptyDir: {}
      name: docker-root
  prerelease-ghcr:
    env:
    - name: DOCKER_CONFIG
      value: /var/run/ci/docker
    secrets:
    - file: /var/run/ci/docker/config.json
      project: istio-prow-build
      secret: prerelease_ghcr_istio
  release:
    env:
    - name: COSIGN_KEY
      value: awskms:///alias/istio-cosign
    - name: AWS_REGION
      value: us-west-2
    - name: DOCKER_CONFIG
      value: /var/run/ci/docker
    - name: GRAFANA_TOKEN_FILE
      value: /var/run/ci/grafana/token
    - name: GITHUB_TOKEN_FILE
      value: /var/run/ci/github/token
    podSpec:
      containers: null
      serviceAccountName: prowjob-release
    secrets:
    - file: /var/run/ci/docker/config.json
      project: istio-prow-build
      secret: release_docker_istio
    - file: /var/run/ci/github/token
      project: istio-prow-build
      secret: release_github_istio-release
    - file: /var/run/ci/grafana/token
      project: istio-prow-build
      secret: release_grafana_istio
  rustccache:
    env:
    - name: RUST_CACHE_DIR
      value: /var/run/rustc-cache
    volumeMounts:
    - mountPath: /var/run/rustc-cache
      name: build-cache
      subPath: rustc
  testing-pusher:
    env:
    - name: DOCKER_CONFIG
      value: /var/run/ci/docker
    secrets:
    - file: /var/run/ci/docker/config.json
      secret: testing_ghcr_istio
  tracing:
    env:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: grpc
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://collector.opentelemetry:4317
    - name: OTEL_EXPORTER_OTLP_INSECURE
      value: "true"
  trusted:
    podSpec:
      containers: null
      nodeSelector:
        testing: trusted
      tolerations:
      - effect: NoSchedule
        key: testing
        operator: Equal
        value: trusted
requirements:
- cache
- cache
resources_presets:
  default:
    limits:
      cpu: "3"
      memory: 24Gi
    requests:
      cpu: "1"
      memory: 3Gi
