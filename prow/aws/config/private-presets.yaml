presets:
- labels:
    preset-override-deps: master-release
  env:
  - name: DEPENDENCIES
    valueFrom:
      configMapKeyRef:
        name: master-release-deps
        key: dependencies
- labels:
    preset-override-deps: master-istio
  env:
  - name: DEPENDENCIES
    valueFrom:
      configMapKeyRef:
        name: master-istio-deps
        key: dependencies
- labels:
    preset-override-deps: release-1.31-release
  env:
  - name: DEPENDENCIES
    valueFrom:
      configMapKeyRef:
        name: release-1.31-release-deps
        key: dependencies
- labels:
    preset-override-deps: release-1.31-istio
  env:
  - name: DEPENDENCIES
    valueFrom:
      configMapKeyRef:
        name: release-1.31-istio-deps
        key: dependencies
- labels:
    preset-override-envoy: "true"
  env:
  - name: ISTIO_ENVOY_BASE_URL
    value: https://storage.googleapis.com/istio-build-private/proxy
- labels:
    preset-override-envoy-r2: "true"
  env:
  - name: ISTIO_ENVOY_BASE_URL
    value: s3://istio-build-private/proxy
- labels:
    preset-enable-netrc: "true"
  volumeMounts:
  - mountPath: /home/.netrc
    subPath: .netrc
    name: netrc
    readOnly: true
  volumes:
  - name: netrc
    secret:
      secretName: netrc-secret
      items:
      - key: secret
        path: .netrc
        mode: 0600
